<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Groq local</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        input, button, textarea { width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; }
        button { background: #f55036; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
        #output { background: #f1f3f4; padding: 15px; border-left: 5px solid #f55036; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Test Groq (configuration locale)</h2>
    <p>La clé reste dans le fichier local et n'est jamais envoyée au navigateur.</p>

    <label for="prompt">Prompt:</label>
    <textarea id="prompt" rows="3">Réponds uniquement : Groq fonctionne.</textarea>

    <button id="sendBtn">Tester Groq</button>

    <h3>Résultat</h3>
    <div id="output">Cliquez sur « Tester Groq » pour vérifier la configuration locale.</div>

<script>
    const promptInput = document.getElementById('prompt');
    const sendBtn = document.getElementById('sendBtn');
    const outputDiv = document.getElementById('output');

    sendBtn.addEventListener('click', async () => {
        const prompt = promptInput.value.trim();

        if (!prompt) {
            outputDiv.innerText = 'Saisissez un prompt.';
            return;
        }

        sendBtn.disabled = true;
        outputDiv.innerText = 'Appel Groq en cours…';

        try {
            const response = await fetch('/api/ai/grok', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ prompt })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || `Erreur HTTP ${response.status}`);
            }

            outputDiv.innerText = data.text || 'Groq n’a renvoyé aucun texte.';

        } catch (error) {
            outputDiv.innerText = `Erreur :\n${error.message}`;
        } finally {
            sendBtn.disabled = false;
        }
    });
</script>

</body>
</html>
